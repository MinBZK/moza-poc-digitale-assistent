name: Production deploy

# Bouwt de backend-image, pusht naar GHCR en deployt naar ZAD in project pm-5sj
# (hetzelfde project als de frontend, zodat de frontend-pod de backend intern
# bereikt). Beveiligingskeuzes (zie docs/decisions/PDR-010 en de host-README):
#   - backend is internal-only: NIET "Publiceer op het web" op ZAD;
#   - GEEN LLM-sleutels op de deployment — gebruikers leveren een sleutel via de
#     UI (x-vlam-api-key / x-claude-api-key). Daarom staat hier geen enkele
#     LLM-secret; alleen ZAD_API_KEY is nodig voor de deploy. Dat is een bewuste
#     keuze (PDR-010): geen gedeelde sleutel om leeg te trekken op een host die
#     nog geen authenticatie op /chat heeft.
#   - ALLOWED_ORIGINS blijft in de component-config LEEG. Dat is de strikte
#     stand: de frontend-pod bereikt de backend same-origin via de reverse
#     proxy, dus CORS komt er niet aan te pas. Zet hier niets in "voor de
#     zekerheid" — dat opent iets wat nu dicht is. Is er ooit wél cross-origin
#     verkeer, dan een concrete whitelist en nooit "*"; bij "*" waarschuwt de
#     host bij het opstarten (zie docs/deploy-zad.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nodig om de image naar GHCR te pushen
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bepaal image-ref (GHCR vereist lowercase)
        id: image
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${REPO,,}"
          echo "ref=${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
      - name: Log in bij GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build en push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/host/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy naar ZAD (production)
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: pm-5sj
          # Deployment-name = poc: dezelfde deployment als de frontend-component
          # `proef`, zodat backend en frontend in één namespace zitten en intern
          # bereikbaar zijn (backend is niet publiek gepubliceerd).
          deployment-name: poc
          component: dabackend
          image: ${{ needs.build.outputs.image }}
          # Internal-only: geen publieke URL → de externe readiness-poll van de
          # action kan er niet bij. ZAD's eigen readiness-probe (GET /health)
          # staat los hiervan in de component-config.
          wait-for-ready: "false"
