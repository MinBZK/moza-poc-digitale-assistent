name: Production deploy

# Bouwt de backend-image, pusht naar GHCR en deployt naar ZAD in project pm-5sj
# (hetzelfde project als de frontend, zodat de frontend-pod de backend intern
# bereikt). Beveiligingskeuzes (zie README en PR-omschrijving):
#   - backend is internal-only: NIET "Publiceer op het web" op ZAD;
#   - GEEN LLM-sleutels op de deployment — gebruikers leveren een sleutel via de
#     UI (x-vlam-api-key / x-claude-api-key). Daarom staat hier geen enkele
#     LLM-secret; alleen ZAD_API_KEY is nodig voor de deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nodig om de image naar GHCR te pushen
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Bepaal image-ref (GHCR vereist lowercase)
        id: image
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${REPO,,}"
          echo "ref=${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
      - name: Log in bij GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build en push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/host/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy naar ZAD (production)
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: pm-5sj
          # Deployment-name = poc: dezelfde deployment als de frontend-component
          # `proef`, zodat backend en frontend in één namespace zitten en intern
          # bereikbaar zijn (backend is niet publiek gepubliceerd).
          deployment-name: poc
          component: dabackend
          image: ${{ needs.build.outputs.image }}
          # Internal-only: geen publieke URL → de externe readiness-poll van de
          # action kan er niet bij. ZAD's eigen readiness-probe (GET /health)
          # staat los hiervan in de component-config.
          wait-for-ready: "false"
