[package]
name = "da-rekenkern"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Rekenkern van de Digitale assistent: regelrecht-engine, beslisgraaf en uitleg, in de browser van de afnemer"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
# Gepind op een commit van regelrecht main; zie bronnen.json en PDR-017.
regelrecht-engine = { git = "https://github.com/MinBZK/regelrecht", rev = "abfce035dbb46fea8a4461c55dc12f742dc329b8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# Zelfde versie als in Cargo.lock van de engine; de wasm-bindgen-CLI moet exact gelijk zijn.
wasm-bindgen = { version = "=0.2.114", optional = true }

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }

[[bin]]
name = "rekenkern"
path = "src/bin/rekenkern.rs"

[profile.release]
opt-level = "s"
lto = true
